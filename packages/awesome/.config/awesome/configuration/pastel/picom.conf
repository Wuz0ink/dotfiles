backend = "glx";
vsync = true;

# === Opacity ===
inactive-opacity = 0.7;
active-opacity = 1.0;
frame-opacity = 0.9;
inactive-opacity-override = false;
alpha-step = 0.05;

opacity-rule = [
  "100:class_g = 'Google-chrome' && focused",
  "95:class_g = 'Google-chrome' && !focused",
  "90:class_g = 'Spotify'",
  "90:class_g = 'Rofi'",
  "100:class_g = 'Alacritty' && focused",
  "85:class_g = 'Alacritty' && !focused"
];

# === Fading ===
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;
no-fading-openclose = false;
no-fading-destroyed-argb = false;

# === Shadows ===
shadow = true;
shadow-radius = 12;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity = 0.4;
shadow-ignore-shaped = false;
detect-rounded-corners = true;

# === Blur ===
blur: {
  method = "kernel";
  strength = 5;
}
blur-background = true;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Rofi'",
  "class_g = 'Spotify'",
  "class_g = 'Alacritty'",
  "class_g = 'slop'"
];

# === Corner rounding ===
corner-radius = 8.0;
rounded-corners-exclude = [
  "class_g = 'Awesome'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# === Performance tweaks ===
unredir-if-possible = true;
use-damage = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
glx-swap-method = 2;

